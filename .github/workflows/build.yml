name: Build site

# Собирает сайт и публикует архив podpisat-site.zip в релиз.
# Сервер забирает последний релиз скриптом deploy/install.ps1.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  HELP4X_REPO: marat560-tech/help4x-desk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Если тесты не прошли, сборка останавливается и сайт на сервере остаётся прежним
      - name: Tests
        run: node tests/run.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get Help4x release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p files
          tag=$(gh release list -R "$HELP4X_REPO" --limit 1 --json tagName --jq '.[0].tagName')
          echo "Help4x release: $tag"
          gh release download "$tag" -R "$HELP4X_REPO" --pattern 'Help4x-*-x64.exe' --dir files
          exe=$(ls files/Help4x-*-x64.exe | head -1 | xargs basename)
          ver=$(echo "$exe" | sed -E 's/Help4x-([0-9.]+)-x64.exe/\1/')
          curl -sSL -o "files/help4x-$ver-src.tar.gz" "https://github.com/$HELP4X_REPO/archive/refs/tags/$tag.tar.gz"
          printf '{"version": "%s", "file": "%s", "source": "%s"}\n' "$ver" "$exe" "help4x-$ver-src.tar.gz" > files/help4x.json
          ls -la files

      - name: Build
        run: |
          pip install jinja2
          python build.py
          zip -qr podpisat-site.zip site deploy
          ls -la podpisat-site.zip

      # Раздел ЕГАИС в настоящем браузере с тестовым УТМ (Chrome уже есть на сервере сборки).
      # Не прошли — релиз не публикуется, сайт на сервере остаётся прежним.
      - name: Tests ЕГАИС
        env:
          EGAIS_CHROME_CHANNEL: chrome
        run: |
          # Причина падения попадает в аннотацию сборки — её видно и без полного журнала
          oneline() { tail -c 3000 "$1" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          npm install --no-save --no-package-lock playwright-core@1.63.0 > npm.log 2>&1 || { cat npm.log; echo "::error title=npm install::$(oneline npm.log)"; exit 1; }
          node tests/egais/run.js > egais.log 2>&1 || { cat egais.log; grep -E '✗|упал|Error|пройдено' -A4 egais.log > fail.log || true; echo "::error title=Тесты ЕГАИС::$(oneline fail.log)"; exit 1; }
          cat egais.log

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: site-${{ github.run_number }}
          name: Сайт, сборка ${{ github.run_number }}
          make_latest: "true"
          files: podpisat-site.zip
